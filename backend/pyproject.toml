[tool.poetry]
name = "grid-con-backend"
version = "1.0.0"
description = "Generic read-only API over the Silver layer of the Grid Con database (FastAPI + SQLAlchemy)."
authors = ["Grid Con Customer Journey"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11.0"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.23.0" }
sqlalchemy = "^2.0.7"
pydantic = "^2.11.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.poetry.source]]
name = "50hertzPublic"
# this feed aggregates both, the private (EGPythonPrivate) and the public (PyPI) feed
url = "https://artifactstore.belgrid.net/pypi/EGPython/simple"
priority = 'primary'
