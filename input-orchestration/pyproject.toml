[project]
name = "grid-con-ingestion"
version = "0.1.0"
description = "Input Orchestration: Airflow DAG that imports grid connection requests from the C4C/GRONOS export into the central SQLite database."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "fastexcel>=0.12",
    "pyarrow>=15",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grid_con_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
